<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#96d2ff">
  <title>손끝 클라이밍 · FINGERTIP CLIMB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="웹캠 속 두 손으로 절벽을 오르는 클라이밍 게임 화면"></canvas>
<video id="cam" playsinline muted></video>
<div id="zone-tip" style="display:none"></div>

<section class="screen show" id="title">
  <div class="card">
    <p class="kicker">HAND TRACKING · CLIMBING</p>
    <h1>손끝 클라이밍</h1>
    <p class="intro">웹캠 앞에 두 손을 들면 그 손이 그대로 클라이머의 손이 돼요.<br>60m 절벽 꼭대기까지 올라가세요!</p>
    <div class="shapes">
      <div><span>✊</span><b>주먹</b><em>홀드 잡기</em></div>
      <div><span>⬇️</span><b>잡고 내리기</b><em>몸 끌어올리기</em></div>
      <div><span>🖐</span><b>손 펴기</b><em>놓기</em></div>
      <div><span>👌</span><b>OK</b><em>작은 노란 홀드</em></div>
    </div>
    <div class="btns">
      <button id="btn-cam" class="primary">📷 카메라로 시작</button>
      <button id="btn-mouse">🖱 마우스로 시작</button>
    </div>
    <p id="status">카메라와 1m쯤 떨어져 두 손이 화면 위쪽까지 다 보이게 서 주세요.</p>
    <p class="note">마우스: 커서로 두 손 이동 · 왼쪽/오른쪽 버튼 = 왼손/오른손 쥐기 · Shift+버튼 = OK 모양 · 두 손으로 잡고 Space = 다이나믹 점프</p>
  </div>
</section>

<section class="screen" id="result">
  <div class="card">
    <p class="kicker">SUMMIT!</p>
    <h2>정상 도착!</h2>
    <div id="result-rank"></div>
    <p id="result-score"></p>
    <p id="result-detail"></p>
    <div class="btns">
      <button id="btn-again" class="primary">다시 오르기</button>
      <button id="btn-title">처음으로</button>
    </div>
  </div>
</section>

<script src="tracker.js"></script>
<script src="game.js"></script>
</body>
</html>
